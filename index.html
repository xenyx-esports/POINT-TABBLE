<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>XENYX Tournament Points</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:#fff;
  padding:15px;
}

.container{
  max-width:1100px;
  margin:auto;
}

header{
  text-align:center;
  padding:20px 0;
  border-bottom:1px solid #333;
  margin-bottom:20px;
}

header h1{
  color:#ff2020;
  font-size:28px;
}

header p{
  color:#aaa;
  margin-top:6px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  color:#ff3030;
  margin-bottom:15px;
}

input,button{
  border:none;
  outline:none;
  border-radius:8px;
  padding:10px;
}

input{
  background:#1d1d1d;
  color:white;
  border:1px solid #333;
  width:100%;
}

button{
  cursor:pointer;
  font-weight:bold;
}

.red{
  background:#e50909;
  color:white;
}

.green{
  background:#087f23;
  color:white;
}

.gray{
  background:#333;
  color:white;
}

.danger{
  background:#8d0000;
  color:white;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:10px;
}

.team{
  border:1px solid #333;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.team-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.team-title strong{
  color:#ff4444;
}

.matches{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:7px;
}

.match{
  background:#181818;
  border:1px solid #303030;
  border-radius:8px;
  padding:7px;
}

.match b{
  display:block;
  text-align:center;
  margin-bottom:6px;
  color:#aaa;
  font-size:12px;
}

.match input{
  padding:7px;
  margin-bottom:5px;
  font-size:12px;
}

.standings{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.standings th,
.standings td{
  padding:10px 6px;
  text-align:center;
  border-bottom:1px solid #292929;
}

.standings th{
  color:#ff4040;
  background:#151515;
}

.qualify{
  background:#073c18 !important;
}

.login-box{
  max-width:450px;
  margin:50px auto;
}

.admin-box{
  display:none;
}

.admin-list{
  margin-top:15px;
}

.admin-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:#191919;
  border:1px solid #333;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
}

.admin-info{
  flex:1;
}

.active{
  color:#20e050;
}

.disabled{
  color:#ff4040;
}

.top-badge{
  font-size:12px;
  padding:4px 7px;
  border-radius:6px;
  background:#8b6500;
  color:white;
}

.hidden{
  display:none !important;
}

@media(max-width:700px){
  .matches{
    grid-template-columns:repeat(2,1fr);
  }

  .row{
    grid-template-columns:1fr;
  }

  .admin-item{
    flex-direction:column;
    align-items:stretch;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>XENYX E-SPORTS</h1>
  <p>Tournament Points System</p>
</header>


<!-- LOGIN -->

<div id="loginSection" class="card login-box">

<h2>🔐 ADMIN LOGIN</h2>

<div class="row">

<div>
<label>Email</label>
<input id="loginEmail" type="email" placeholder="Admin email">
</div>

<div>
<label>Password</label>
<input id="loginPassword" type="password" placeholder="Password">
</div>

</div>

<button class="red" onclick="login()" style="width:100%">
LOGIN
</button>

<p id="loginMsg" style="margin-top:10px;color:#ff4040"></p>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="admin-box">

<div class="card">

<h2>👑 ADMIN PANEL</h2>

<p id="adminWelcome" style="color:#aaa;margin-bottom:15px"></p>

<button class="danger" onclick="logout()">LOGOUT</button>

</div>


<!-- ADMIN MANAGEMENT -->

<div id="adminManagement" class="card">

<h2>👑 ADMIN MANAGEMENT</h2>

<p style="color:#aaa;margin-bottom:15px">
Only Main Admin can add or manage admins.
</p>

<div class="row">

<div>
<label>Admin Name</label>
<input id="newAdminName" placeholder="Example: Rahim">
</div>

<div>
<label>Email</label>
<input id="newAdminEmail" type="email" placeholder="admin@email.com">
</div>

</div>

<div class="row">

<div>
<label>Password</label>
<input id="newAdminPassword" type="password" placeholder="Minimum 6 characters">
</div>

<div style="display:flex;align-items:end">
<button class="red" onclick="addNewAdmin()" style="width:100%">
➕ ADD NEW ADMIN
</button>
</div>

</div>

<p id="adminMsg" style="margin-top:10px"></p>

<div id="adminList" class="admin-list"></div>

</div>


<!-- TOURNAMENT -->

<div class="card">

<h2>⚙️ TOURNAMENT SETTINGS</h2>

<div class="row">

<div>
<label>Date</label>
<input id="eventDate" type="date">
</div>

<div>
<label>Time</label>
<input id="eventTime" type="time">
</div>

</div>

<div class="row">

<div>
<label>TOP QUALIFY</label>
<input id="qualifyCount" type="number" value="4" min="1">
</div>

<div style="display:flex;align-items:end">
<button class="green" onclick="setQualify()" style="width:100%">
SET QUALIFY
</button>
</div>

</div>

</div>


<!-- TEAM ADD -->

<div class="card">

<h2>➕ ADD TEAM</h2>

<div class="row">

<div>
<input id="teamName" placeholder="Team name">
</div>

<div>
<button class="red" onclick="addTeam()" style="width:100%">
ADD TEAM
</button>
</div>

</div>

</div>


<!-- TEAMS -->

<div class="card">

<h2>🎮 MATCH RESULTS</h2>

<div id="teams"></div>

</div>


<!-- STANDINGS -->

<div class="card">

<h2>🏆 OVERALL STANDINGS</h2>

<div style="overflow-x:auto">

<table class="standings">

<thead>

<tr>
<th>#</th>
<th>TEAM</th>
<th>KILLS</th>
<th>PLACE</th>
<th>TOTAL</th>
</tr>

</thead>

<tbody id="standingsBody"></tbody>

</table>

</div>

</div>


<!-- BUTTONS -->

<div class="card">

<div class="row">

<button class="green" onclick="saveTournament()">
💾 SAVE
</button>

<button class="gray" onclick="loadTournament()">
🔄 LOAD
</button>

</div>

<div class="row">

<button class="danger" onclick="resetTournament()">
♻️ RESET
</button>

<button class="red" onclick="downloadImage()">
📸 DOWNLOAD IMAGE
</button>

</div>

</div>

</div>

</div>


<script type="module">

import {
 initializeApp,
 getApps,
 getApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 collection,
 getDocs,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
 apiKey:"AIzaSyBfPTsq4gDFN8MdLrt4Lv_ccWjrgb_CtZ0",
 authDomain:"pointsystem-3e20a.firebaseapp.com",
 projectId:"pointsystem-3e20a",
 storageBucket:"pointsystem-3e20a.firebasestorage.app",
 messagingSenderId:"335071663643",
 appId:"1:335071663643:web:9cdddd709af5c37dda8abe"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* SECOND AUTH FOR ADDING ADMIN */

const secondaryApp = initializeApp(
 firebaseConfig,
 "SecondaryApp"
);

const secondaryAuth = getAuth(secondaryApp);


/* MAIN ADMIN UID */

const MAIN_ADMIN_UID =
"TVnLZR8XnQfN1B4QNe2g7vgX1yx2";


let currentAdmin = null;

let currentAdminData = null;

let teams = [];

let qualifyCount = 4;


/* LOGIN */

window.login = async function(){

 const email =
 document.getElementById("loginEmail").value.trim();

 const password =
 document.getElementById("loginPassword").value;

 const msg =
 document.getElementById("loginMsg");

 msg.style.color="#ff4040";

 if(!email || !password){

   msg.textContent="Email and password required.";

   return;
 }

 try{

   await signInWithEmailAndPassword(
     auth,
     email,
     password
   );

 }catch(error){

   msg.textContent =
   error.message;

 }

};


/* AUTH STATE */

onAuthStateChanged(auth,async(user)=>{

 if(!user){

   currentAdmin=null;
   currentAdminData=null;

   document.getElementById("loginSection")
   .style.display="block";

   document.getElementById("adminPanel")
   .style.display="none";

   return;
 }

 currentAdmin=user;

 try{

   const adminRef =
   doc(db,"admins",user.uid);

   const snap =
   await getDoc(adminRef);

   if(!snap.exists()){

     await signOut(auth);

     alert("You are not an admin.");

     return;
   }

   currentAdminData=snap.data();

   if(currentAdminData.active !== true){

     await signOut(auth);

     alert("Your admin account is disabled.");

     return;
   }


   document.getElementById("loginSection")
   .style.display="none";

   document.getElementById("adminPanel")
   .style.display="block";


   document.getElementById("adminWelcome")
   .textContent =
   "Logged in as: "+
   (currentAdminData.name ||
    currentAdminData.email ||
    user.email);


   /*
      MAIN ADMIN CHECK
      UID + ROLE BOTH CHECKED
   */

   const isSuperAdmin =
     user.uid === MAIN_ADMIN_UID ||
     currentAdminData.role === "superAdmin";


   if(isSuperAdmin){

      document.getElementById("adminManagement")
      .style.display="block";

      await loadAdminList();

   }else{

      document.getElementById("adminManagement")
      .style.display="none";

   }


   await loadTournament();

 }catch(error){

   console.error(error);

   alert(
    "Admin data load error: "+
    error.message
   );

 }

});


/* LOGOUT */

window.logout = async function(){

 await signOut(auth);

};


/* ADD NEW ADMIN */

window.addNewAdmin = async function(){

 if(!currentAdmin){

   alert("Login first.");

   return;
 }


 const isSuperAdmin =
 currentAdmin.uid === MAIN_ADMIN_UID ||
 currentAdminData?.role === "superAdmin";


 if(!isSuperAdmin){

   alert("Only Main Admin can add new admin.");

   return;
 }


 const name =
 document.getElementById("newAdminName")
 .value.trim();

 const email =
 document.getElementById("newAdminEmail")
 .value.trim();

 const password =
 document.getElementById("newAdminPassword")
 .value;


 const msg =
 document.getElementById("adminMsg");


 if(!name || !email || !password){

   msg.style.color="#ff4040";

   msg.textContent=
   "সবগুলো ঘর পূরণ করো।";

   return;
 }


 if(password.length < 6){

   msg.style.color="#ff4040";

   msg.textContent=
   "Password minimum 6 characters.";

   return;
 }


 try{

   msg.style.color="#aaa";

   msg.textContent=
   "Creating admin...";


   /*
      SECONDARY AUTH ব্যবহার করছি,
      তাই Main Admin logout হবে না।
   */

   const result =
   await createUserWithEmailAndPassword(
     secondaryAuth,
     email,
     password
   );


   const newUid =
   result.user.uid;


   await setDoc(
     doc(db,"admins",newUid),
     {
       name:name,
       email:email,
       role:"admin",
       active:true,
       createdAt:serverTimestamp(),
       createdBy:currentAdmin.uid
     }
   );


   await signOut(secondaryAuth);


   msg.style.color="#20e050";

   msg.textContent=
   "✅ New Admin successfully added.";


   document.getElementById("newAdminName")
   .value="";

   document.getElementById("newAdminEmail")
   .value="";

   document.getElementById("newAdminPassword")
   .value="";


   await loadAdminList();

 }catch(error){

   console.error(error);

   msg.style.color="#ff4040";

   msg.textContent=
   error.message;

 }

};


/* LOAD ADMIN LIST */

async function loadAdminList(){

 const list =
 document.getElementById("adminList");

 list.innerHTML=
 "<p style='color:#aaa'>Loading admins...</p>";


 try{

   const snapshot =
   await getDocs(
     collection(db,"admins")
   );


   list.innerHTML="";


   snapshot.forEach(item=>{

     const data=item.data();

     const uid=item.id;

     const div=
     document.createElement("div");

     div.className="admin-item";


     const status =
       data.active === true
       ? `<span class="active">ACTIVE</span>`
       : `<span class="disabled">DISABLED</span>`;


     const role =
       data.role === "superAdmin"
       ? "👑 SUPER ADMIN"
       : "ADMIN";


     const buttons =
       uid === MAIN_ADMIN_UID
       ? `<span class="top-badge">MAIN ADMIN</span>`
       : `
         <button class="gray"
           onclick="toggleAdmin('${uid}',${data.active===true})">
           ${data.active===true ? "DISABLE":"ENABLE"}
         </button>

         <button class="danger"
           onclick="deleteAdmin('${uid}')">
           DELETE
         </button>
       `;


     div.innerHTML=`

       <div class="admin-info">

         <strong>
         ${escapeHTML(data.name || "Admin")}
         </strong>

         <br>

         <small>
         ${escapeHTML(data.email || "")}
         </small>

         <br>

         <small>
         ${role} • ${status}
         </small>

       </div>

       <div>
       ${buttons}
       </div>
     `;


     list.appendChild(div);

   });


 }catch(error){

   console.error(error);

   list.innerHTML=
   "<p style='color:#ff4040'>"+
   error.message+
   "</p>";

 }

}


/* TOGGLE ADMIN */

window.toggleAdmin = async function(uid,newState){

 if(!confirm(
   newState
   ? "Disable this admin?"
   : "Enable this admin?"
 )) return;


 try{

   await updateDoc(
     doc(db,"admins",uid),
     {
       active:!newState
     }
   );


   await loadAdminList();


 }catch(error){

   alert(error.message);

 }

};


/* DELETE ADMIN ACCESS */

window.deleteAdmin = async function(uid){

 if(uid===MAIN_ADMIN_UID){

   alert("Main Admin cannot be deleted.");

   return;
 }


 if(!confirm(
   "এই admin-এর access delete করবে?"
 )) return;


 try{

   /*
      এখানে Firestore admin document delete হবে।
      Firebase Authentication account delete হবে না।
      ফলে login করলেও admin access পাবে না।
   */

   await deleteDoc(
     doc(db,"admins",uid)
   );


   await loadAdminList();


 }catch(error){

   alert(error.message);

 }

};


/* ESCAPE */

function escapeHTML(value){

 return String(value)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}


/* ADD TEAM */

window.addTeam=function(){

 const name=
 document.getElementById("teamName")
 .value.trim();


 if(!name){

   alert("Team name দাও।");

   return;
 }


 teams.push({

   id:Date.now(),

   name:name,

   matches:Array.from(
     {length:7},
     ()=>({
       kills:0,
       place:0
     })
   )

 });


 document.getElementById("teamName")
 .value="";


 renderTeams();

 renderStandings();

};


/* DELETE TEAM */

window.deleteTeam=function(id){

 if(!confirm("এই team delete করবে?"))
 return;


 teams=
 teams.filter(team=>team.id!==id);


 renderTeams();

 renderStandings();

};


/* RENDER TEAMS */

function renderTeams(){

 const box=
 document.getElementById("teams");

 box.innerHTML="";


 teams.forEach(team=>{

   const div=
   document.createElement("div");

   div.className="team";


   let html=`

     <div class="team-title">

       <strong>
       ${escapeHTML(team.name)}
       </strong>

       <button class="danger"
       onclick="deleteTeam(${team.id})">
       DELETE
       </button>

     </div>

     <div class="matches">
   `;


   for(let i=0;i<7;i++){

     html+=`

       <div class="match">

         <b>MATCH ${i+1}</b>

         <input
         type="number"
         min="0"
         value="${team.matches[i].kills}"
         onchange="updateMatch(${team.id},${i},'kills',this.value)"
         placeholder="KILL">

         <input
         type="number"
         min="0"
         value="${team.matches[i].place}"
         onchange="updateMatch(${team.id},${i},'place',this.value)"
         placeholder="PLACE">

       </div>

     `;

   }


   html+=`</div>`;


   div.innerHTML=html;

   box.appendChild(div);

 });

}


/* UPDATE MATCH */

window.updateMatch=function(
 id,
 matchIndex,
 type,
 value
){

 const team=
 teams.find(t=>t.id===id);

 if(!team)return;


 team.matches[matchIndex][type]=
 Math.max(0,Number(value)||0);


 renderStandings();

};


/* POINT CALCULATION */

function getTeamStats(team){

 let kills=0;

 let place=0;


 team.matches.forEach(match=>{

   kills += Number(match.kills)||0;

   place += Number(match.place)||0;

 });


 return{

   kills:kills,

   placement:place,

   total:kills+place

 };

}


/* STANDINGS */

function getSortedTeams(){

 return [...teams].sort((a,b)=>{

   const A=getTeamStats(a);

   const B=getTeamStats(b);


   if(B.total!==A.total)
   return B.total-A.total;


   if(B.kills!==A.kills)
   return B.kills-A.kills;


   return B.placement-A.placement;

 });

}


/* RENDER STANDINGS */

function renderStandings(){

 const body=
 document.getElementById("standingsBody");

 body.innerHTML="";


 const sorted=
 getSortedTeams();


 sorted.forEach((team,index)=>{

   const stats=
   getTeamStats(team);


   const tr=
   document.createElement("tr");


   if(index < qualifyCount){

     tr.classList.add("qualify");

   }


   let badge="";


   if(index===0)
   badge=" 🏆";

   else if(index===1)
   badge=" 🥈";

   else if(index===2)
   badge=" 🥉";


   tr.innerHTML=`

     <td>
     ${index+1}
     </td>

     <td>
     <strong>
     ${escapeHTML(team.name)}
     </strong>
     ${badge}
     </td>

     <td>
     ${stats.kills}
     </td>

     <td>
     ${stats.placement}
     </td>

     <td>
     <strong>
     ${stats.total}
     </strong>
     </td>

   `;


   body.appendChild(tr);

 });

}


/* QUALIFY */

window.setQualify=function(){

 const value=
 Number(
   document.getElementById("qualifyCount")
   .value
 );


 qualifyCount=
 Math.max(1,value||1);


 renderStandings();

};


/* SAVE */

window.saveTournament=async function(){

 if(!currentAdmin){

   alert("Login first.");

   return;
 }


 try{

   await setDoc(
     doc(db,"tournament","current"),
     {

       teams:teams,

       qualifyCount:qualifyCount,

       eventDate:
       document.getElementById("eventDate")
       .value,

       eventTime:
       document.getElementById("eventTime")
       .value,

       updatedAt:serverTimestamp(),

       updatedBy:currentAdmin.uid

     }
   );


   alert("✅ Tournament saved successfully.");

 }catch(error){

   console.error(error);

   alert(
     "Save error: "+
     error.message
   );

 }

};


/* LOAD */

window.loadTournament=async function(){

 try{

   const snap=
   await getDoc(
     doc(db,"tournament","current")
   );


   if(!snap.exists()){

     renderTeams();

     renderStandings();

     return;

   }


   const data=snap.data();


   teams=
   Array.isArray(data.teams)
   ? data.teams
   : [];


   qualifyCount=
   Number(data.qualifyCount)||4;


   document.getElementById("qualifyCount")
   .value=qualifyCount;


   document.getElementById("eventDate")
   .value=data.eventDate||"";


   document.getElementById("eventTime")
   .value=data.eventTime||"";


   renderTeams();

   renderStandings();


 }catch(error){

   console.error(error);

   alert(
     "Load error: "+
     error.message
   );

 }

};


/* RESET */

window.resetTournament=function(){

 if(!confirm(
   "সব team এবং result reset করবে?"
 )) return;


 teams=[];

 qualifyCount=4;


 document.getElementById("qualifyCount")
 .value=4;


 document.getElementById("eventDate")
 .value="";


 document.getElementById("eventTime")
 .value="";


 renderTeams();

 renderStandings();

};


/* DOWNLOAD IMAGE */

window.downloadImage=function(){

 const sorted=
 getSortedTeams();


 const canvas=
 document.createElement("canvas");


 canvas.width=1080;

 canvas.height=1920;


 const ctx=
 canvas.getContext("2d");


 ctx.fillStyle="#080808";

 ctx.fillRect(
   0,0,
   canvas.width,
   canvas.height
 );


 ctx.fillStyle="#ff2020";

 ctx.font="bold 55px Arial";

 ctx.textAlign="center";

 ctx.fillText(
   "XENYX E-SPORTS",
   540,
   100
 );


 ctx.fillStyle="#ffffff";

 ctx.font="bold 38px Arial";

 ctx.fillText(
   "TOURNAMENT POINT TABLE",
   540,
   160
 );


 let y=250;


 sorted.forEach((team,index)=>{

   const stats=
   getTeamStats(team);


   ctx.fillStyle=
   index<qualifyCount
   ? "#073c18"
   : "#151515";


   ctx.fillRect(
     60,
     y-45,
     960,
     100
   );


   ctx.fillStyle="#ffffff";

   ctx.textAlign="left";

   ctx.font="bold 28px Arial";


   ctx.fillText(
     `${index+1}. ${team.name}`,
     85,
     y
   );


   ctx.textAlign="right";

   ctx.fillText(
     `K ${stats.kills}   P ${stats.placement}   TOTAL ${stats.total}`,
     995,
     y
   );


   y+=120;

 });
