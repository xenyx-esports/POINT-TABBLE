<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XENYX E-SPORTS - Tournament Standings</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    padding:15px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:28px;
    margin:10px 0 5px;
    color:#ff3030;
    font-weight:900;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:20px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.card h2{
    color:#ff3030;
    font-size:20px;
    margin-bottom:12px;
}

.global-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:5px;
}

input{
    width:100%;
    background:#0d0d0d;
    border:1px solid #333;
    color:#fff;
    padding:11px;
    border-radius:7px;
    outline:none;
}

input:focus{
    border-color:#ff3030;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-red{
    background:#ff3030;
    color:#fff;
}

.btn-dark{
    background:#292929;
    color:#fff;
}

.btn-green{
    background:#159447;
    color:#fff;
}

.btn-blue{
    background:#245fd1;
    color:#fff;
}

.team-add{
    display:flex;
    gap:10px;
}

.team-add input{
    flex:1;
}

.team{
    background:#101010;
    border:1px solid #282828;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
}

.team-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.team-name{
    font-size:18px;
    font-weight:bold;
    color:#fff;
}

.match-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.match-box{
    background:#181818;
    border:1px solid #303030;
    border-radius:7px;
    padding:8px;
}

.match-title{
    text-align:center;
    color:#ff3030;
    font-weight:bold;
    margin-bottom:7px;
    font-size:13px;
}

.small-input{
    padding:8px 5px;
    text-align:center;
    margin-bottom:5px;
}

.delete-btn{
    background:#a91515;
    color:white;
    font-size:12px;
    padding:7px 10px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#ff3030;
    color:#fff;
    padding:12px 8px;
}

td{
    background:#121212;
    border-bottom:1px solid #292929;
    padding:11px 8px;
    text-align:center;
}

td:nth-child(2){
    text-align:left;
    font-weight:bold;
}

.rank{
    font-size:18px;
    font-weight:bold;
}

.total{
    color:#ff4040;
    font-weight:900;
    font-size:18px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

@media(max-width:800px){
    .match-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    body{
        padding:8px;
    }

    .global-info{
        grid-template-columns:1fr;
    }

    .team-add{
        flex-direction:column;
    }

    .match-grid{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>XENYX E-SPORTS</h1>
<div class="subtitle">SEASON 01 - QUALIFIERS</div>

<!-- GLOBAL DATE & TIME -->
<div class="card">
    <h2>Date & Time</h2>

    <div class="global-info">
        <div>
            <label>DATE</label>
            <input type="date" id="globalDate">
        </div>

        <div>
            <label>TIME</label>
            <input type="time" id="globalTime">
        </div>
    </div>
</div>

<!-- TEAM ADD -->
<div class="card">
    <h2>Teams</h2>

    <div class="team-add">
        <input
            type="text"
            id="teamName"
            placeholder="Enter Team Name"
        >

        <button class="btn-red" onclick="addTeam()">
            + ADD TEAM
        </button>
    </div>

    <div id="teamsContainer"></div>

    <div class="controls">
        <button class="btn-dark" onclick="resetAll()">
            RESET ALL
        </button>

        <button class="btn-green" onclick="saveData()">
            SAVE DATA
        </button>

        <button class="btn-blue" onclick="downloadImage()">
            DOWNLOAD FINAL IMAGE
        </button>
    </div>
</div>

<!-- OVERALL -->
<div class="card">
    <h2>OVERALL STANDINGS</h2>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>RANK</th>
                    <th>TEAM</th>
                    <th>MATCH</th>
                    <th>KILL</th>
                    <th>PLACEMENT</th>
                    <th>TOTAL POINT</th>
                </tr>
            </thead>

            <tbody id="overallBody"></tbody>
        </table>
    </div>
</div>

</div>

<script>

const MAX_MATCHES = 7;
const STORAGE_KEY = "xenyxTeams";

let teams = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

/* GLOBAL DATE/TIME */
const globalDate = document.getElementById("globalDate");
const globalTime = document.getElementById("globalTime");

globalDate.value = localStorage.getItem("globalDate") || "";
globalTime.value = localStorage.getItem("globalTime") || "";

globalDate.addEventListener("change", saveGlobalDateTime);
globalTime.addEventListener("change", saveGlobalDateTime);

function saveGlobalDateTime(){
    localStorage.setItem("globalDate", globalDate.value);
    localStorage.setItem("globalTime", globalTime.value);
}


/* ADD TEAM */
function addTeam(){

    const input = document.getElementById("teamName");
    const name = input.value.trim();

    if(!name){
        alert("Enter team name!");
        return;
    }

    teams.push({
        name:name,
        matches:Array.from(
            {length:MAX_MATCHES},
            ()=>({k:"",p:""})
        )
    });

    input.value="";

    saveData();
    renderTeams();
    renderOverall();
}


/* DELETE TEAM */
function deleteTeam(index){

    if(!confirm("Delete this team?")){
        return;
    }

    teams.splice(index,1);

    saveData();
    renderTeams();
    renderOverall();
}


/* CALCULATE */
function calculateTeam(team){

    let kills = 0;
    let placement = 0;
    let matchCount = 0;

    team.matches.forEach(match=>{

        const kValue = match.k;
        const pValue = match.p;

        /*
        Blank K and blank P = match not played.
        0 is considered a played match.
        */
        if(kValue !== "" || pValue !== ""){
            matchCount++;
        }

        kills += Number(kValue) || 0;
        placement += Number(pValue) || 0;
    });

    return {
        name:team.name,
        matches:matchCount,
        kills:kills,
        placement:placement,
        total:kills + placement
    };
}


/* RENDER TEAMS */
function renderTeams(){

    const container = document.getElementById("teamsContainer");

    if(teams.length === 0){
        container.innerHTML =
            '<div class="empty">No team added yet.</div>';
        return;
    }

    container.innerHTML = "";

    teams.forEach((team,index)=>{

        const teamDiv = document.createElement("div");
        teamDiv.className = "team";

        let html = `
            <div class="team-header">

                <div class="team-name">
                    ${escapeHTML(team.name)}
                </div>

                <button
                    class="delete-btn"
                    onclick="deleteTeam(${index})"
                >
                    DELETE
                </button>

            </div>

            <div class="match-grid">
        `;

        for(let i=0;i<MAX_MATCHES;i++){

            html += `
                <div class="match-box">

                    <div class="match-title">
                        MATCH ${i+1}
                    </div>

                    <input
                        class="small-input"
                        type="number"
                        min="0"
                        placeholder="KILL"
                        value="${team.matches[i].k}"
                        onchange="updateMatch(${index},${i},'k',this.value)"
                    >

                    <input
                        class="small-input"
                        type="number"
                        min="0"
                        placeholder="PLACE"
                        value="${team.matches[i].p}"
                        onchange="updateMatch(${index},${i},'p',this.value)"
                    >

                </div>
            `;
        }

        html += `</div>`;

        teamDiv.innerHTML = html;

        container.appendChild(teamDiv);
    });
}


/* UPDATE MATCH */
function updateMatch(teamIndex,matchIndex,type,value){

    teams[teamIndex].matches[matchIndex][type] = value;

    saveData();
    renderOverall();
}


/* OVERALL */
function renderOverall(){

    const body = document.getElementById("overallBody");

    if(teams.length === 0){
        body.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No data available
                </td>
            </tr>
        `;
        return;
    }

    let results = teams.map(calculateTeam);

    results.sort((a,b)=>{

        if(b.total !== a.total)
            return b.total - a.total;

        if(b.kills !== a.kills)
            return b.kills - a.kills;

        return b.placement - a.placement;
    });

    body.innerHTML = "";

    results.forEach((team,index)=>{

        const row = document.createElement("tr");

        row.innerHTML = `
            <td class="rank">${index+1}</td>
            <td>${escapeHTML(team.name)}</td>
            <td>${team.matches}</td>
            <td>${team.kills}</td>
            <td>${team.placement}</td>
            <td class="total">${team.total}</td>
        `;

        body.appendChild(row);
    });
}


/* SAVE */
function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(teams)
    );

    saveGlobalDateTime();
}


/* RESET */
function resetAll(){

    if(!confirm("Are you sure you want to reset everything?")){
        return;
    }

    teams = [];

    localStorage.removeItem(STORAGE_KEY);

    renderTeams();
    renderOverall();
}


/* ESCAPE HTML */
function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* DATE FORMAT */
function formatDate(dateString){

    if(!dateString){
        return "DATE: —";
    }

    const date = new Date(dateString + "T00:00:00");

    return "DATE: " +
        date.toLocaleDateString("en-GB",{
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        });
}


/* TIME FORMAT */
function formatTime(timeString){

    if(!timeString){
        return "TIME: —";
    }

    const parts = timeString.split(":");
    let hour = Number(parts[0]);
    const minute = parts[1];

    const ampm = hour >= 12 ? "PM" : "AM";

    hour = hour % 12;

    if(hour === 0){
        hour = 12;
    }

    return "TIME: " +
        hour.toString().padStart(2,"0") +
        ":" +
        minute +
        " " +
        ampm;
}


/* DOWNLOAD FINAL IMAGE */
function downloadImage(){

    if(teams.length === 0){
        alert("Add teams first!");
        return;
    }

    const canvas = document.createElement("canvas");

    /*
        FINAL IMAGE SIZE
        1080 x 1920
    */
    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    const img = new Image();

    img.onload = function(){

        /* BACKGROUND */
        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        /* DARK OVERLAY */
        ctx.fillStyle = "rgba(0,0,0,0.62)";
        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        /* HEADER */
        ctx.textAlign = "center";

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 42px Arial";

        ctx.fillText(
            "SEASON 01 - QUALIFIERS",
            540,
            100
        );

        ctx.fillStyle = "#ff3030";
        ctx.font = "bold 64px Arial";

        ctx.fillText(
            "XENYX E-SPORTS",
            540,
            175
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px Arial";

        ctx.fillText(
            "PRESENTS",
            540,
            225
        );

        ctx.fillStyle = "#dddddd";
        ctx.font = "bold 28px Arial";

        ctx.fillText(
            formatDate(globalDate.value),
            540,
            275
        );

        ctx.fillText(
            formatTime(globalTime.value),
            540,
            315
        );


        /* TITLE */
        ctx.fillStyle = "#ff3030";
        ctx.font = "bold 48px Arial";

        ctx.fillText(
            "OVERALL STANDINGS",
            540,
            410
        );


        /* DATA */
        let results = teams.map(calculateTeam);

        results.sort((a,b)=>{

            if(b.total !== a.total)
                return b.total - a.total;

            if(b.kills !== a.kills)
                return b.kills - a.kills;

            return b.placement - a.placement;
        });


        /* TABLE */
        const tableX = 55;
        const tableY = 465;
        const tableW = 970;

        const rowH = 78;

        const cols = [
            90,
            360,
            120,
            120,
            140,
            140
        ];

        /* HEADER */
        ctx.fillStyle = "#ff3030";
        ctx.fillRect(
            tableX,
            tableY,
            tableW,
            rowH
        );

        const headers = [
            "RANK",
            "TEAM",
            "MATCH",
            "KILL",
            "PLACEMENT",
            "TOTAL"
        ];

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 22px Arial";
        ctx.textAlign = "center";

        let x = tableX;

        headers.forEach((header,i)=>{

            ctx.fillText(
                header,
                x + cols[i]/2,
                tableY + 49
            );

            x += cols[i];
        });


        /* ROWS */
        results.forEach((team,index)=>{

            const y =
                tableY +
                rowH +
                index * rowH;

            ctx.fillStyle =
                index % 2 === 0
                ? "rgba(20,20,20,0.90)"
                : "rgba(35,35,35,0.90)";

            ctx.fillRect(
                tableX,
                y,
                tableW,
                rowH
            );

            ctx.strokeStyle = "rgba(255,255,255,0.15)";
            ctx.strokeRect(
                tableX,
                y,
                tableW,
                rowH
            );

            const values = [
                index + 1,
                team.name,
                team.matches,
                team.kills,
                team.placement,
                team.total
            ];

            x = tableX;

            values.forEach((value,i)=>{

                ctx.fillStyle =
                    i === 5
                    ? "#ff4040"
                    : "#ffffff";

                ctx.font =
                    i === 5
                    ? "bold 25px Arial"
                    : "bold 21px Arial";

                ctx.fillText(
                    String(value),
                    x + cols[i]/2,
                    y + 49
                );

                x += cols[i];
            });
        });


        /* FOOTER */
        ctx.textAlign = "center";

        ctx.fillStyle = "#ff3030";
        ctx.font = "bold 42px Arial";

        ctx.fillText(
            "XENYX E-SPORTS",
            540,
            1700
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 48px Arial";

        ctx.fillText(
            "FREE FIRE",
            540,
            1760
        );

        ctx.fillStyle = "#ff3030";
        ctx.font = "bold 52px Arial";

        ctx.fillText(
            "MAX",
            540,
            1820
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 25px Arial";

        ctx.fillText(
            "XENYX E-SPORTS",
            540,
            1870
        );


        /* DOWNLOAD */
        const link = document.createElement("a");

        link.download =
            "XENYX-OVERALL-STANDINGS.png";

        link.href = canvas.toDataURL(
            "image/png",
            1.0
        );

        link.click();
    };


    img.onerror = function(){

        alert(
            "pointtabble.png পাওয়া যাচ্ছে না!\n\n" +
            "index.html এর পাশে pointtabble.png রাখো।"
        );
    };


    img.src = "pointtabble.png";
}


/* INITIAL LOAD */
renderTeams();
renderOverall();

</script>

</body>
</html>
